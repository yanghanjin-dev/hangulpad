name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    name: make test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential libzip-dev pkg-config
      - name: Build and test
        run: make clean && make test
      - name: CLI smoke
        run: |
          ./build/hp new /tmp/a.hwpx --text "한글패드" --title ci
          ./build/hp roundtrip /tmp/a.hwpx /tmp/b.hwpx
          ./build/hp open /tmp/b.hwpx | grep -q "한글패드"
          ./build/hp probe /tmp/b.hwpx | grep -q hwpx
